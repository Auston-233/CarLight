<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>LUMIÈRE 跑车 · 灯光与声音</title>
		<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
		<style>
			:root {
				--bg: #07090d;
				--fg: #e8e6e1;
				--mut: #8a8f98;
				--acc: #ffb020;
				box-sizing: border-box;
				padding-top: env(safe-area-inset-top, 0px);
				padding-bottom: env(safe-area-inset-bottom, 0px)
			}

			html,
			body {
				height: 100%;
				margin: 0;
				background: var(--bg);
				color: var(--fg);
				overflow: hidden;
				font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif
			}

			canvas {
				display: block;
				width: 100%;
				height: 100%;
				touch-action: none;
				cursor: grab
			}

			canvas.drag {
				cursor: grabbing
			}

			canvas.hit {
				cursor: pointer
			}

			h1 {
				position: fixed;
				left: 28px;
				top: calc(22px + env(safe-area-inset-top, 0px));
				margin: 0;
				font: 500 30px "Cormorant Garamond", Georgia, serif;
				letter-spacing: .35em
			}

			#hint {
				position: fixed;
				left: 28px;
				top: calc(62px + env(safe-area-inset-top, 0px));
				font-size: 13px;
				color: var(--mut);
				line-height: 1.7
			}

			#bar {
				position: fixed;
				left: 50%;
				bottom: calc(24px + env(safe-area-inset-bottom, 0px));
				transform: translateX(-50%);
				display: flex;
				flex-direction: column;
				gap: 8px;
				align-items: center;
				width: 94%
			}

			.row {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				justify-content: center
			}

			.row button {
				padding: 8px 14px;
				font-size: 13px;
				user-select: none;
				touch-action: none
			}

			button {
				background: rgba(20, 24, 30, .75);
				color: var(--fg);
				border: 1px solid #2b313b;
				padding: 10px 18px;
				border-radius: 999px;
				font-size: 14px;
				cursor: pointer;
				backdrop-filter: blur(8px)
			}

			button:hover {
				border-color: var(--acc)
			}

			button.on {
				border-color: var(--acc);
				color: var(--acc)
			}

			button:focus-visible {
				outline: 2px solid var(--acc);
				outline-offset: 2px
			}
		</style>
	</head>
	<body>
		<h1>LUMIÈRE</h1>
		<div id="hint">按住左键拖动旋转 · 滚轮缩放<br>点击车门开关 · 可进入车内</div>
		<div id="bar">
			<div class="row">
				<button id="bExt" class="on">车外</button>
				<button id="bInt">进入车内</button>
				<button id="bDoor">开启车门</button>
				<button id="bSnd">声音：开</button>
				<button onclick="window.location.href = 'lumiere-lights.html'">返回车灯</button>
			</div>
			<div class="row"><button id="bPos" class="on">示廓</button><button id="bBrk">刹车</button><button
					id="bRev">倒车</button><button id="bOff">熄灭</button><button id="bWel">迎宾</button><button
					id="bL">左转</button><button id="bR">右转</button><button id="bHz">双闪</button><button
					id="bBr">呼吸</button><button id="bHorn">喇叭</button></div>
		</div>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
		<script>
			const T = THREE,
				W = () => innerWidth,
				H = () => innerHeight;
			const renderer = new T.WebGLRenderer({
				antialias: true
			});
			renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
			renderer.setSize(W(), H());
			document.body.appendChild(renderer.domElement);
			const cv = renderer.domElement;
			const scene = new T.Scene();
			scene.background = new T.Color(0x07090d);
			scene.fog = new T.Fog(0x07090d, 10, 24);
			const cam = new T.PerspectiveCamera(45, W() / H(), .1, 60);

			// lights
			scene.add(new T.HemisphereLight(0x8fa4c8, 0x1a1410, .7));
			const key = new T.DirectionalLight(0xdfe8ff, .9);
			key.position.set(3, 6, 4);
			scene.add(key);
			const rim = new T.DirectionalLight(0xff8a50, .5);
			rim.position.set(-5, 3, -4);
			scene.add(rim);
			const cabinLight = new T.PointLight(0xffa040, .7, 3.5);
			cabinLight.position.set(0, 1, 0);
			scene.add(cabinLight);

			// ground
			const ground = new T.Mesh(new T.CircleGeometry(14, 64).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({
				color: 0x0c0f14,
				roughness: .35,
				metalness: .6
			}));
			scene.add(ground);
			const ring = new T.Mesh(new T.RingGeometry(3.6, 3.63, 96).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({
				color: 0x2a313c
			}));
			ring.position.y = .01;
			scene.add(ring);

			const car = new T.Group();
			scene.add(car);
			const paint = new T.MeshStandardMaterial({
				color: 0x2b323c,
				metalness: .85,
				roughness: .28
			});
			const dark = new T.MeshStandardMaterial({
				color: 0x0a0c10,
				metalness: .5,
				roughness: .6
			});
			const glass = new T.MeshStandardMaterial({
				color: 0x7a8da8,
				transparent: true,
				opacity: .22,
				metalness: .9,
				roughness: .05,
				side: T.DoubleSide,
				depthWrite: false
			});
			const mesh = (g, m, x = 0, y = 0, z = 0) => {
				const o = new T.Mesh(g, m);
				o.position.set(x, y, z);
				return o
			};
			const box = (w, h, d) => new T.BoxGeometry(w, h, d);

			function extrude(pts, depth, mat, bev = .035) {
				const s = new T.Shape(pts.map(p => new T.Vector2(p[0], p[1])));
				const g = new T.ExtrudeGeometry(s, {
					depth: depth - bev * 2,
					bevelEnabled: true,
					bevelThickness: bev,
					bevelSize: bev,
					bevelSegments: 3
				});
				g.translate(0, 0, -(depth - bev * 2) / 2);
				return new T.Mesh(g, mat);
			}
			// body (front +x, rear -x)
			car.add(extrude([
				[1, .25],
				[2.28, .25],
				[2.28, .6],
				[1.85, .74],
				[1, .92]
			], 1.9, paint));
			car.add(extrude([
				[-2.28, .25],
				[-.9, .25],
				[-.9, 1],
				[-1.5, .96],
				[-2.28, .8]
			], 1.9, paint));
			car.add(mesh(box(1.9, .15, 1.9), dark, .05, .32, 0));
			car.add(mesh(box(1.9, .16, 1.9), paint, .05, .33, 0));
			// glass canopy
			const canopy = extrude([
				[1, .92],
				[.2, 1.38],
				[-.7, 1.34],
				[-.9, 1]
			], 1.6, glass, .01);
			car.add(canopy);

			// doors
			const doors = [];
			[-1, 1].forEach(side => {
				const p = new T.Group();
				p.position.set(1, 0, side * .95);
				const panel = mesh(box(1.9, .5, .07), paint, -.95, .66, 0);
				const win = mesh(box(1.55, .42, .03), glass, -.78, 1.12, 0);
				p.add(panel, win);
				panel.userData.door = win.userData.door = p;
				p.userData = {
					side,
					cur: 0,
					tgt: 0
				};
				car.add(p);
				doors.push(p);
			});

			// wheels
			[
				[1.4, 1],
				[1.4, -1],
				[-1.4, 1],
				[-1.4, -1]
			].forEach(([x, s]) => {
				const w = new T.Group();
				w.position.set(x, .38, s * .93);
				w.add(mesh(new T.CylinderGeometry(.38, .38, .3, 28).rotateX(Math.PI / 2), dark));
				const rimM = new T.MeshStandardMaterial({
					color: 0x9aa3ad,
					metalness: 1,
					roughness: .25
				});
				w.add(mesh(new T.CylinderGeometry(.24, .24, .32, 28).rotateX(Math.PI / 2), rimM));
				for (let i = 0; i < 5; i++) {
					const sp = mesh(box(.46, .04, .34), dark);
					sp.rotation.z = i * Math.PI / 5;
					w.add(sp)
				}
				car.add(w);
			});

			// ---- front lights ----
			const lightMats = [];
			const glow = (c, g, s, i, n) => {
				const m = new T.MeshBasicMaterial({
					color: c
				});
				m.userData = {
					base: new T.Color(c),
					g,
					s,
					i,
					n
				};
				lightMats.push(m);
				return m
			};
			for (let s of [-1, 1]) {
				for (let i = 0; i < 10; i++) car.add(mesh(box(.02, .12, .045), glow(0xfff1cf, 'fw', s, i, 10), 2.31, .5, s * (
					.2 + i * .068)));
				for (let i = 0; i < 22; i++) car.add(mesh(box(.015, .018, .02), glow(0xff3b4f, 'fd', s, i, 22), 2.3, .38, s * (
					.18 + i * .031)));
			}
			car.add(mesh(new T.TorusGeometry(.05, .004, 8, 32).rotateY(Math.PI / 2), new T.MeshBasicMaterial({
				color: 0xaab4c0
			}), 2.3, .47, 0));
			car.add(mesh(box(.03, .1, 1.0), dark, 2.285, .3, 0));
			// ---- rear lights ----
			const amber = [
				[],
				[]
			];
			for (let s of [-1, 1]) {
				for (let i = 0; i < 16; i++) {
					const h = .05 + .09 * (1 - Math.abs(i - 7.5) / 8) * 1.3,
						z = .08 + i * .052;
					car.add(mesh(box(.02, h, .028), glow(0xff3b4f, 'rr', s, i, 16), -2.31, .72, s * z));
				}
				for (let i = 0; i < 7; i++) {
					const m = glow(0xffb020, 'ra', s, i, 7);
					car.add(mesh(box(.02, .04, .05), m, -2.31, .58, s * (.14 + i * .095)));
					amber[s > 0 ? 1 : 0].push(m);
				}
				car.add(mesh(box(.02, .035, .2), glow(0xe8f0ff, 'rv', s, 0, 1), -2.31, .4, s * .55));
			}
			const cvs = document.createElement('canvas');
			cvs.width = 256;
			cvs.height = 64;
			const cx = cvs.getContext('2d');
			cx.fillStyle = '#0d1016';
			cx.fillRect(0, 0, 256, 64);
			cx.strokeStyle = '#3a414c';
			cx.lineWidth = 3;
			cx.strokeRect(2, 2, 252, 60);
			cx.fillStyle = '#9aa1ab';
			cx.font = '500 24px Georgia,serif';
			cx.textAlign = 'center';
			cx.textBaseline = 'middle';
			cx.fillText('L U M I È R E', 128, 34);
			car.add(mesh(new T.PlaneGeometry(.36, .09).rotateY(-Math.PI / 2), new T.MeshBasicMaterial({
				map: new T.CanvasTexture(cvs)
			}), -2.32, .33, 0));

			// ---- interior ----
			const seatM = new T.MeshStandardMaterial({
				color: 0x6b4a32,
				roughness: .6
			});
			for (let s of [-1, 1]) {
				car.add(mesh(box(.55, .12, .5), seatM, -.15, .48, s * .42));
				const b = mesh(box(.1, .6, .5), seatM, -.5, .82, s * .42);
				b.rotation.z = .2;
				car.add(b);
			}
			car.add(mesh(box(.35, .28, 1.7), dark, .78, .78, 0));
			car.add(mesh(box(.9, .12, .2), dark, .15, .52, 0));
			const scr = mesh(new T.PlaneGeometry(.5, .18).rotateY(-Math.PI / 2), new T.MeshBasicMaterial({
				color: 0x3fd0ff
			}), .6, .82, 0);
			car.add(scr);
			const wheelS = mesh(new T.TorusGeometry(.17, .022, 10, 28).rotateY(Math.PI / 2), dark, .5, .97, -.42);
			wheelS.rotation.z = -.4;
			car.add(wheelS);
			car.add(mesh(box(.02, .03, 1.6), glow(0xffb020, 'in', 1, 0, 1), .6, .64, 0));

			// ---- controls ----
			const st = {
				mode: 'ext',
				th: -2.5,
				ph: .25,
				r: 7.2,
				yaw: 0,
				pit: -.05,
				light: true
			};
			const head = new T.Vector3(.1, 1, -.4),
				look = new T.Vector3(0, .6, 0),
				lookT = new T.Vector3();
			let down = false,
				moved = 0,
				lx = 0,
				ly = 0;
			cv.addEventListener('pointerdown', e => {
				down = true;
				moved = 0;
				lx = e.clientX;
				ly = e.clientY;
				cv.setPointerCapture(e.pointerId);
				cv.classList.add('drag')
			});
			cv.addEventListener('pointerup', e => {
				down = false;
				cv.classList.remove('drag');
				if (moved < 5) pick(e)
			});
			cv.addEventListener('pointermove', e => {
				if (down) {
					const dx = e.clientX - lx,
						dy = e.clientY - ly;
					lx = e.clientX;
					ly = e.clientY;
					moved += Math.abs(dx) + Math.abs(dy);
					if (st.mode === 'ext') {
						st.th -= dx * .006;
						st.ph = Math.max(.02, Math.min(1.3, st.ph + dy * .005))
					} else {
						st.yaw += dx * .005;
						st.pit = Math.max(-1, Math.min(1, st.pit - dy * .005))
					}
				} else cv.classList.toggle('hit', !!hitDoor(e));
			});
			cv.addEventListener('wheel', e => {
				e.preventDefault();
				st.r = Math.max(4.2, Math.min(11, st.r + e.deltaY * .005))
			}, {
				passive: false
			});
			const ray = new T.Raycaster(),
				mv = new T.Vector2();

			function hitDoor(e) {
				mv.set(e.clientX / W() * 2 - 1, -(e.clientY / H()) * 2 + 1);
				ray.setFromCamera(mv, cam);
				const h = ray.intersectObjects(car.children.filter(c => doors.includes(c)).flatMap(c => c.children), false)[0];
				return h && h.object.userData.door;
			}

			function pick(e) {
				const d = hitDoor(e);
				if (d) {
					d.userData.tgt = d.userData.tgt ? 0 : 1;
					sync()
				}
			}

			function sync() {
				bDoor.textContent = doors.some(d => d.userData.tgt) ? '关闭车门' : '开启车门'
			}
			const $ = id => document.getElementById(id);
			const bExt = $('bExt'),
				bInt = $('bInt'),
				bDoor = $('bDoor');
			bExt.onclick = () => {
				st.mode = 'ext';
				bExt.classList.add('on');
				bInt.classList.remove('on')
			};
			bInt.onclick = () => {
				st.mode = 'int';
				st.yaw = 0;
				st.pit = -.05;
				bInt.classList.add('on');
				bExt.classList.remove('on')
			};
			bDoor.onclick = () => {
				const o = doors.some(d => d.userData.tgt);
				doors.forEach(d => d.userData.tgt = o ? 0 : 1);
				sync()
			};

			let ac = null,
				muted = false,
				pad = null,
				horn = null,
				wel = -99,
				lastPh = 0,
				lastRev = 0;
			const F = {
				pos: true,
				brake: false,
				rev: false,
				L: false,
				R: false,
				hz: false,
				br: false
			};
			const now = () => performance.now() / 1000,
				AMB = new T.Color(0xffb020);
			const AC = () => {
				ac = ac || new(window.AudioContext || window.webkitAudioContext)();
				if (ac.state === 'suspended') ac.resume();
				return ac
			};

			function tone(f, d, o = {}) {
				if (muted) return;
				const a = AC(),
					os = a.createOscillator(),
					g = a.createGain(),
					t0 = a.currentTime + (o.at || 0),
					v = o.v || .15;
				os.type = o.type || 'sine';
				os.frequency.setValueAtTime(f, t0);
				if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t0 + d);
				g.gain.setValueAtTime(0, t0);
				g.gain.linearRampToValueAtTime(v, t0 + .006);
				g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
				os.connect(g).connect(a.destination);
				os.start(t0);
				os.stop(t0 + d + .02);
			}

			function startPad() {
				if (muted || pad) return;
				const a = AC(),
					o = a.createOscillator(),
					g = a.createGain();
				g.gain.value = 0;
				o.frequency.value = 196;
				o.connect(g).connect(a.destination);
				o.start();
				pad = {
					o,
					g
				}
			}

			function stopPad() {
				if (pad) {
					pad.g.gain.value = 0;
					pad.o.stop();
					pad = null
				}
			}

			function hornOn() {
				if (muted || horn) return;
				const a = AC(),
					g = a.createGain(),
					f = a.createBiquadFilter();
				f.type = 'lowpass';
				f.frequency.value = 1800;
				const os = [415, 370].map(fr => {
					const o = a.createOscillator();
					o.type = 'sawtooth';
					o.frequency.value = fr;
					o.connect(f);
					o.start();
					return o
				});
				g.gain.setValueAtTime(0, a.currentTime);
				g.gain.linearRampToValueAtTime(.18, a.currentTime + .03);
				f.connect(g).connect(a.destination);
				horn = {
					os,
					g
				};
				hb.classList.add('on');
			}

			function hornOff() {
				hb.classList.remove('on');
				if (!horn) return;
				const h = horn,
					t0 = ac.currentTime;
				horn = null;
				h.g.gain.cancelScheduledValues(t0);
				h.g.gain.setValueAtTime(h.g.gain.value, t0);
				h.g.gain.linearRampToValueAtTime(0, t0 + .08);
				h.os.forEach(o => o.stop(t0 + .1));
			}
			const ids = {
				pos: 'bPos',
				brake: 'bBrk',
				rev: 'bRev',
				L: 'bL',
				R: 'bR',
				hz: 'bHz',
				br: 'bBr'
			};
			const refresh = () => {
				for (const k in ids) $(ids[k]).classList.toggle('on', F[k])
			};
			const tg = k => {
				F[k] = !F[k];
				if (k === 'L' || k === 'R' || k === 'hz') {
					const v = F[k];
					F.L = F.R = F.hz = false;
					F[k] = v
				}
				refresh()
			};
			$('bPos').onclick = () => {
				tg('pos');
				tone(F.pos ? 1200 : 700, .08, {
					type: 'square',
					v: .08
				})
			};
			$('bBrk').onclick = () => {
				tg('brake');
				if (F.brake) tone(140, .14, {
					type: 'triangle',
					v: .35,
					to: 60
				})
			};
			$('bRev').onclick = () => {
				tg('rev');
				lastRev = 0
			};
			['L', 'R', 'hz'].forEach(k => $(ids[k]).onclick = () => {
				tg(k);
				lastPh = 1
			});
			$('bBr').onclick = () => {
				tg('br');
				F.br ? startPad() : stopPad()
			};
			$('bWel').onclick = () => {
				wel = now();
				[523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .6, {
					at: i * .2,
					v: .12
				}))
			};
			$('bOff').onclick = () => {
				for (const k in F) F[k] = false;
				wel = -99;
				refresh();
				stopPad();
				tone(600, .3, {
					to: 180,
					v: .1
				})
			};
			$('bSnd').onclick = () => {
				muted = !muted;
				$('bSnd').textContent = muted ? '声音：关' : '声音：开';
				if (muted) {
					stopPad();
					hornOff()
				} else if (F.br) startPad()
			};
			const hb = $('bHorn');
			hb.addEventListener('pointerdown', e => {
				e.preventDefault();
				hornOn()
			});
			['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => hb.addEventListener(ev, hornOff));

			function updateLamps() {
				const n = now(),
					p = (n - wel) / 3.2,
					wp = p >= 0 && p < 1,
					ph = (n % .9) / .9,
					brv = .5 + .5 * Math.sin(n * 2.2 - 1.57);
				if (F.L || F.R || F.hz) {
					if (ph < lastPh) tone(1400, .04, {
						type: 'square',
						v: .1
					});
					if (lastPh < .7 && ph >= .7) tone(1000, .04, {
						type: 'square',
						v: .1
					})
				}
				lastPh = ph;
				if (F.rev && n - lastRev > .9) {
					lastRev = n;
					tone(1000, .22, {
						type: 'square',
						v: .06
					})
				}
				if (pad) {
					pad.o.frequency.value = 196 + 40 * brv;
					pad.g.gain.value = .02 + .08 * brv
				}
				lightMats.forEach(m => {
					const d = m.userData,
						g = d.g,
						u = d.n > 1 ? d.i / (d.n - 1) : 0;
					let b = 0,
						col = d.base;
					const act = F.hz || (F.L && d.s < 0) || (F.R && d.s > 0),
						sw = ph < .7 ? Math.max(0, Math.min(1, (ph / .7 - u) * 6)) : 0;
					if (g === 'fw') b = F.pos ? .4 : 0;
					else if (g === 'fd') b = F.pos ? .85 : 0;
					else if (g === 'rr') b = F.brake ? 1 : F.pos ? .35 : 0;
					else if (g === 'rv') b = F.rev ? 1 : 0;
					else if (g === 'in') b = .6;
					if (F.br && (g === 'fw' || g === 'fd' || (g === 'rr' && !F.brake))) b = .08 + .92 * brv;
					if (act && g === 'fd') {
						col = AMB;
						b = sw
					}
					if (act && g === 'ra') b = sw;
					if (wp && g !== 'in') {
						const w = Math.max(0, Math.min(1, (p * 1.5 - (1 - u) * .5) * 5)) * (p > .8 ? (1 - p) / .2 : 1);
						if (w > b) b = w
					}
					m.color.copy(col).multiplyScalar(b);
				});
				cabinLight.intensity = .2 + (F.pos ? .5 : 0);
			}
			addEventListener('resize', () => {
				renderer.setSize(W(), H());
				cam.aspect = W() / H();
				cam.updateProjectionMatrix()
			});

			const tmp = new T.Vector3(),
				goal = new T.Vector3();
			let t = 0;

			function loop() {
				requestAnimationFrame(loop);
				t += .016;
				doors.forEach(d => {
					const u = d.userData;
					u.cur += (u.tgt - u.cur) * .08;
					d.rotation.y = u.side * u.cur * 1.0;
					d.rotation.z = -u.cur * .12 * (1)
				});
				if (st.mode === 'ext') {
					goal.set(Math.cos(st.ph) * Math.sin(st.th), Math.sin(st.ph), Math.cos(st.ph) * Math.cos(st.th))
						.multiplyScalar(st.r).add(new T.Vector3(0, .6, 0));
					lookT.set(0, .6, 0);
				} else {
					goal.copy(head);
					lookT.set(Math.cos(st.pit) * Math.cos(st.yaw), Math.sin(st.pit), Math.cos(st.pit) * Math.sin(st.yaw)).add(
						head);
				}
				cam.position.lerp(goal, .08);
				look.lerp(lookT, .12);
				cam.lookAt(look);
				const fov = st.mode === 'int' ? 75 : 45;
				if (Math.abs(cam.fov - fov) > .1) {
					cam.fov += (fov - cam.fov) * .08;
					cam.updateProjectionMatrix()
				}
				updateLamps();
				renderer.render(scene, cam);
			}
			loop();
		</script>
	</body>
</html>
